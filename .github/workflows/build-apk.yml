name: Build APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Rename app to Gallery
        run: |
          find android/app/src -name strings.xml -exec sed -i -E 's#(<string name="app_name"[^>]*>)[^<]*(</string>)#\1Gallery\2#' {} +
          sed -i -E 's#("appName"[[:space:]]*:[[:space:]]*)"[^"]*"#\1"Gallery"#' lib/l10n/app_*.arb
      - name: Apply libre flavor dependencies
        run: bash scripts/apply_flavor_libre.sh
      - name: Build APK
        run: ./flutterw build apk --release --flavor libre --split-per-abi
      - uses: actions/upload-artifact@v4
        with:
          name: aves-apk
          path: build/app/outputs/flutter-apk/*.apk

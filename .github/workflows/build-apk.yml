name: Build APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Rename app to Gallery
        run: |
          find android/app/src -name strings.xml -exec sed -i -E 's#(<string name="app_name"[^>]*>)[^<]*(</string>)#\1Gallery\2#' {} +
          sed -i -E 's#("appName"[[:space:]]*:[[:space:]]*)"[^"]*"#\1"Gallery"#' lib/l10n/app_*.arb
      - name: Apply libre flavor dependencies
        run: bash scripts/apply_flavor_libre.sh
      - name: Create signing key
        run: |
          keytool -genkeypair -keystore "$RUNNER_TEMP/gallery.jks" -alias gallery -keyalg RSA -keysize 2048 -validity 10000 -storepass galleryPass123 -keypass galleryPass123 -dname "CN=Gallery"
      - name: Build APK
        env:
          AVES_STORE_FILE: ${{ runner.temp }}/gallery.jks
          AVES_STORE_PASSWORD: galleryPass123
          AVES_KEY_ALIAS: gallery
          AVES_KEY_PASSWORD: galleryPass123
        run: ./flutterw build apk -t lib/main_libre.dart --release --flavor libre --split-per-abi
      - uses: actions/upload-artifact@v4
        with:
          name: aves-apk
          path: build/app/outputs/flutter-apk/*.apk
